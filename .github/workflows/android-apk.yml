name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar y sincronizar Android
        run: npm run lint && npm run android:sync
      - name: Compilar APK instalable
        run: ./gradlew assembleDebug
        working-directory: apps/frontend/android
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoTP-debug-apk
          path: apps/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
