{% extends "base.html" %}
{% block title %}Nueva oferta · {{ app_name }}{% endblock %}
{% block content %}
<section class="page">
  <form class="form-card" method="post" style="max-width:760px;margin:0 auto;">
    <div class="row between"><div><p class="eyebrow">Publicar</p><h1>Nueva oferta</h1></div><a class="btn btn-secondary" href="{{ url_for('empresa_panel') }}">Cancelar</a></div>
    <div class="field"><label>Cargo</label><input name="titulo" required></div>
    <div class="field"><label>Descripcion breve</label><textarea name="descripcion" required></textarea></div>
    <div class="grid-2">
      <div class="field"><label>Especialidad</label><select name="especialidad_req" required><option value="">Selecciona</option>{% for i in especialidades %}<option>{{ i }}</option>{% endfor %}</select></div>
      <div class="field"><label>Comuna</label><select name="comuna" required><option value="">Selecciona</option>{% for i in comunas %}<option>{{ i }}</option>{% endfor %}</select></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Modalidad</label><select name="modalidad">{% for i in modalidades %}<option>{{ i }}</option>{% endfor %}</select></div>
      <div class="field"><label>Jornada</label><select name="jornada">{% for i in jornadas %}<option>{{ i }}</option>{% endfor %}</select></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Sueldo</label><input name="sueldo" placeholder="$300.000 - $450.000"></div>
      <div class="field"><label>Vacantes</label><input name="vacantes" type="number" min="1" value="1"></div>
    </div>
    <div class="field"><label>Requisitos separados por ;</label><input name="requisitos" placeholder="Excel basico; orden; disponibilidad"></div>
    <button class="btn btn-primary btn-wide">Publicar</button>
  </form>
</section>
{% endblock %}
