{% extends "base.html" %}
{% block title %}Editar empresa · Admin{% endblock %}
{% block content %}
<section class="page">
  <form class="form-card" method="post" style="max-width:820px;margin:0 auto;">
    <div class="row between"><div><p class="eyebrow">Admin</p><h1>Editar empresa</h1></div><a class="btn btn-secondary" href="{{ url_for('admin_panel') }}">Volver</a></div>
    <div class="grid-2">
      <div class="field"><label>Nombre</label><input name="nombre" value="{{ empresa.nombre }}" required></div>
      <div class="field"><label>Email</label><input name="email" type="email" value="{{ empresa.email }}" required></div>
      <div class="field"><label>Nueva clave opcional</label><input name="password" type="password"></div>
      <div class="field"><label>Rubro</label><input name="rubro" value="{{ empresa.rubro }}" required></div>
      <div class="field"><label>Ubicacion</label><input name="ubicacion" value="{{ empresa.ubicacion }}" required></div>
      <div class="field"><label>Contacto</label><input name="contacto" value="{{ empresa.contacto or '' }}"></div>
      <div class="field"><label>Web</label><input name="web" value="{{ empresa.web or '' }}"></div>
      <div class="field"><label>Iniciales</label><input name="logo_inicial" value="{{ empresa.logo_inicial or '' }}"></div>
      <div class="field"><label>Color</label><input name="color" value="{{ empresa.color or '' }}"></div>
    </div>
    <div class="field"><label>Descripcion</label><textarea name="descripcion">{{ empresa.descripcion or '' }}</textarea></div>
    <button class="btn btn-primary btn-wide">Guardar empresa</button>
  </form>
</section>
{% endblock %}
