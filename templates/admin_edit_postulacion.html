{% extends "base.html" %}
{% block title %}Editar postulacion · Admin{% endblock %}
{% block content %}
<section class="page">
  <form class="form-card" method="post" style="max-width:760px;margin:0 auto;">
    <div class="row between"><div><p class="eyebrow">Admin</p><h1>Editar postulacion</h1></div><a class="btn btn-secondary" href="{{ url_for('admin_panel') }}">Volver</a></div>
    <p class="muted">{{ postulacion.usuario.nombre_completo }} · {{ postulacion.oferta.titulo }} · {{ postulacion.oferta.empresa.nombre }}</p>
    <div class="field">
      <label>Estado</label>
      <select name="estado">
        {% for estado in ["En revision", "Aceptado", "Rechazado"] %}
          <option value="{{ estado }}" {% if postulacion.estado == estado %}selected{% endif %}>{{ estado }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field"><label>Mensaje del usuario</label><textarea name="mensaje">{{ postulacion.mensaje or '' }}</textarea></div>
    <div class="field"><label>Motivo / respuesta</label><textarea name="motivo_empresa">{{ postulacion.motivo_empresa or '' }}</textarea></div>
    <button class="btn btn-primary btn-wide">Guardar postulacion</button>
  </form>
</section>
{% endblock %}
